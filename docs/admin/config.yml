backend:
  name: github
  repo: robertjackson-engage/ghf-redesign
  branch: main
media_folder: "docs/assets/img"
public_folder: "/assets/img"
site_url: https://robertjackson-engage.github.io/ghf-redesign/
publish_mode: simple
collections:
  - name: blog
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "content/blog"
    create: true
    slug: "{{slug}}"
    summary: "{{title}}  —  {{date}}"
    sortable_fields: [date, title]
    fields:
      - { name: title, label: "Title", widget: string }
      - { name: date, label: "Date", widget: datetime, date_format: "YYYY-MM-DD", time_format: false, format: "YYYY-MM-DD" }
      - { name: author, label: "Author", widget: string, default: "The GHF Team" }
      - { name: image, label: "Cover Image", widget: image, required: false }
      - { name: excerpt, label: "Short Summary", widget: text }
      - { name: featured, label: "Feature on top?", widget: boolean, default: false, required: false }
      - { name: body, label: "Post Content", widget: markdown }
  - name: staff
    label: "Staff & Trainers"
    label_singular: "Trainer"
    folder: "content/staff"
    create: true
    slug: "{{slug}}"
    summary: "{{name}}  —  {{role}}"
    sortable_fields: [order, name]
    fields:
      - { name: name, label: "Name", widget: string }
      - { name: role, label: "Role", widget: string, default: "Personal Trainer" }
      - { name: photo, label: "Photo", widget: image, required: false, media_folder: "docs/assets/img/staff", public_folder: "/assets/img/staff" }
      - { name: order, label: "Display order (e.g. 01)", widget: string, required: false }
      - { name: specialties, label: "Specialties (comma separated)", widget: string, required: false }
      - { name: hometown, label: "Hometown", widget: string, required: false }
      - { name: education, label: "Education", widget: string, required: false }
      - { name: certifications, label: "Certifications", widget: string, required: false }
      - { name: hobbies, label: "Hobbies", widget: string, required: false }
      - { name: body, label: "Message from this trainer", widget: markdown, required: false }
