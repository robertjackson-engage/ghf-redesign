<script>
/* The CMS speaks to our backend using its Gitea-compatible protocol, so Sveltia labels the button
   "Gitea / Forgejo". Staff actually sign in with their Microsoft work account — say so. */
(function relabel(){var seen=false;function fix(){document.querySelectorAll('button').forEach(function(b){if(/Gitea/.test(b.textContent)){b.textContent='Sign in with Microsoft';seen=true;}});}
 new MutationObserver(fix).observe(document.documentElement,{childList:true,subtree:true,characterData:true});fix();})();
</script>
